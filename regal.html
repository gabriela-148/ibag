<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* Reset */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* Background video */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }


    /* Page content */
    .container {
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1, h2 {
      text-align: center;
    }

    /* Landing link */
    .center-link {
      text-align: center;
      margin-top: 40px;
    }

    .center-link a {
      color: white;
      font-size: 1.3rem;
      text-decoration: underline;
      cursor: pointer;
    }

    .card {
      background: rgba(255, 255, 255, 0);
      color: black;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    canvas {
      max-width: 100%;
    }

    footer {
      text-align: center;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {
      #bg-video {
        display: none;
      }
    }

    /* Hotspots */
    .hotspot {
      position: fixed;
      display: block;
      background: rgba(255,255,255,0);
      border: 2px dashed rgb(255, 71, 71); /* remove later */
      z-index: 1;
    }

    #showDashboard {
      left: 21.3%;
      top: 82.2%;
      width: 58.7%;
      height: 4.8%;
    } /* click here button */

  </style>
</head>

<body>

  <!-- Background Video -->

  <video autoplay muted loop playsinline id="bg-video">
    <source src="background.mp4" type="video/mp4">
  </video>
  

  <div class="container">

    <!-- Landing link -->
    <div class="center-link">
      <a href="movie_stats.html" id="showDashboard" class="hotspot"></a>
    </div>

  </div>

</body>
</html>
