<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ibag's Movie World</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    height: 100%;
    background: #b8c8d6;
    font-family: Arial, Helvetica, sans-serif;
}

/* ===== PAGE ===== */
.page {
    height: 100%;
    padding: 48px;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 32px;
}

/* ===== HEADER ===== */
.header {
    text-align: center;
}

.header h1 {
    font-size: 38px;
    letter-spacing: 2px;
    color: #243241;
}

/* ===== MAIN CONTENT ===== */
.content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
}

/* ===== LARGE SLIDESHOW WINDOW ===== */
.slideshow {
    width: 80vw;
    max-width: 900px;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 16px;
    border: 6px solid #4a5b6b;
    outline: 4px solid rgba(252, 229, 252, 0.7);
    box-shadow:
        0 0 28px rgba(252, 229, 252, 0.65),
        inset 0 0 22px rgba(0,0,0,0.25);
    overflow: hidden;
}

.slideshow video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ===== PLAY BUTTON ===== */
.menu-btn {
    font-family: Monaco, monospace;
    font-size: 20px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 18px 48px;
    cursor: pointer;

    background: linear-gradient(
        180deg,
        rgba(70, 90, 120, 0.9),
        rgba(40, 55, 80, 0.9)
    );

    color: #ffffff;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.4);

    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.menu-btn:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<div class="page">

    <header class="header">
        <h1>Ibag's Movie World</h1>
    </header>

    <main class="content">

        <!-- SLIDESHOW -->
        <div class="slideshow">
            <video id="player" muted playsinline preload="auto"></video>
        </div>

        <!-- PLAY BUTTON -->
        <button class="menu-btn" id="playBtn">Play Movie</button>

    </main>
</div>

<script>
const videos = [
    "slideshow.mp4",
];

const player = document.getElementById("player");
const playBtn = document.getElementById("playBtn");

let index = 0;
let playing = false;

function playNext() {
    player.src = videos[index];
    player.currentTime = 0;
    player.play();
}

player.addEventListener("ended", () => {
    index = (index + 1) % videos.length;
    playNext();
});

playBtn.addEventListener("click", () => {
    if (playing) return;
    playing = true;
    playBtn.style.display = "none";
    playNext();
});
</script>

</body>
</html>
