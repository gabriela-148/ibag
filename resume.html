<!doctype html>
<html>
<head>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: auto; /* allow scrolling if stage is bigger than viewport */
}

/* Stage with fixed size */
.stage {
    position: relative;
    width: 2100px;  /* fixed design width */
    height: 1600px; /* fixed design height */
    background: url("2026 Resume_new.jpeg") top left / cover no-repeat;
    margin: 0 auto; /* center stage horizontally if screen is wider */
}   

/* Hotspots */
.hotspot {
    position: absolute; /* relative to .stage */
    display: block;
    background: rgba(255,255,255,0); /* invisible */
    border: 2px dashed rgb(255, 71, 71); /* remove later */
}

/* Hotspot positions */
#link1 { top: 575px; left: 1790px; width: 140px; height: 100px;} /* plane */

/* Modal styles */
.modal {
    display: none; /* hidden by default */
    position: fixed;
    z-index: 1000; /* on top */
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background-color: #fff;
    padding: 30px;
    border-radius: 10px;
    max-width: 500px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    animation: fadeIn 0.5s;
}

.modal-content h2 {
    margin-top: 0;
    color: #ff4747;
}

.modal-content p {
    font-size: 18px;
    margin: 20px 0;
}

.close-btn {
    background-color: #ff4747;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
}

.close-btn:hover {
    background-color: #e03f3f;
}

@keyframes fadeIn {
    from {opacity: 0; transform: scale(0.8);}
    to {opacity: 1; transform: scale(1);}
}
</style>
</head>

<body>
<div class="stage">
    <a href="Gabriella Huegel - Resume 2026.pdf"
    download="Gabriella Huegel - Resume"
    id="link1" class="hotspot"></a>
</div>

</body>
</html>
